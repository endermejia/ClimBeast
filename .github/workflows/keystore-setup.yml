# TEMPORARY workflow: run once to generate the release signing keystore.
# After the keystore artifact is downloaded and its SHA-256 captured, delete
# this workflow so nobody can accidentally generate a replacement key.
name: keystore-setup

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "Password secrets are missing" >&2
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=ClimBeast, OU=App, O=ClimBeast, L=Madrid, ST=Madrid, C=ES"

      - name: Print certificate fingerprints
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          echo "SHA-256 (needed for Digital Asset Links / assetlinks.json):"
          keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" \
            | sed -n '/SHA256:/p'

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: android.keystore
